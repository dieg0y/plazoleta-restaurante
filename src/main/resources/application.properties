spring.application.name=restaurante

# ============ Servidor ============
server.port=8081

# ============ Base de datos MySQL (contenedor docker mysql-plazoleta) ============
spring.datasource.url=jdbc:mysql://localhost:3306/plazoleta_restaurante?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ JPA / Hibernate ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============ OpenFeign: URL del microservicio usuario (se usa desde HU2) ============
spring.cloud.openfeign.client.config.usuario-service.url=http://localhost:8080